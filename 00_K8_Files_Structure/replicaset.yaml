# ==============================================================================
# Kubernetes ReplicaSet Manifest Structure
# ==============================================================================
# A ReplicaSet's purpose is to maintain a stable set of replica Pods running at
# any given time. It is often used to guarantee the availability of a specified
# number of identical Pods.
# ==============================================================================

apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: medtrack-backend-rs
  namespace: default
  labels:
    app: medtrack
    tier: backend
    environment: dev

spec:
  # Desired number of pod instances
  replicas: 3

  # Label selector used by the ReplicaSet controller to identify its pods.
  # CRITICAL RULE: matchLabels MUST match spec.template.metadata.labels!
  selector:
    matchLabels:
      app: medtrack
      tier: backend

  # Pod template definition
  template:
    metadata:
      name: medtrack-backend
      labels:
        app: medtrack
        tier: backend
        environment: dev
    spec:
      restartPolicy: Always
      containers:
        - name: backend-container
          image: nginx:alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
